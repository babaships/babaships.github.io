<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Original artwork for Capy Planner. No third-party assets. -->
  <rect width="512" height="512" fill="#f6ead0"/>
  <!-- onsen water -->
  <path d="M0 330 Q64 300 128 330 T256 330 T384 330 T512 330 V512 H0 Z" fill="#8fd0c4"/>
  <!-- ear -->
  <circle cx="318" cy="196" r="26" fill="#8a5a33"/>
  <!-- head -->
  <rect x="120" y="170" width="290" height="190" rx="95" fill="#b3804f"/>
  <!-- snout -->
  <rect x="96" y="230" width="150" height="130" rx="62" fill="#9a6a40"/>
  <!-- nostrils -->
  <ellipse cx="140" cy="262" rx="9" ry="12" fill="#4a2e18"/>
  <ellipse cx="184" cy="258" rx="9" ry="12" fill="#4a2e18"/>
  <!-- happy closed eye -->
  <path d="M262 246 Q284 224 306 246" fill="none" stroke="#4a2e18" stroke-width="10" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M140 316 Q168 338 200 316" fill="none" stroke="#4a2e18" stroke-width="8" stroke-linecap="round"/>
  <!-- cheek -->
  <circle cx="276" cy="296" r="20" fill="#d99a76" opacity="0.7"/>
  <!-- yuzu on head -->
  <circle cx="250" cy="150" r="50" fill="#f4c430"/>
  <circle cx="234" cy="134" r="12" fill="#fbe38a" opacity="0.8"/>
  <path d="M250 100 Q268 78 292 86 Q282 108 250 104 Z" fill="#5c9a4a"/>
  <!-- water in front of body -->
  <path d="M0 340 Q64 312 128 340 T256 340 T384 340 T512 340 V400 H0 Z" fill="#8fd0c4" opacity="0.9"/>
  <path d="M0 380 Q64 352 128 380 T256 380 T384 380 T512 380 V512 H0 Z" fill="#6bbbae"/>
</svg>
