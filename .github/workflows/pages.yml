name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: pages
        uses: actions/configure-pages@v6
      # base_url = https://<org>.github.io for an org root site (or .../<repo> for a project site, or a custom domain).
      # Optional repo variables (Settings > Secrets and variables > Actions > Variables): GOATCOUNTER, GSC_TOKEN, BING_TOKEN.
      - run: node build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
          GSC_TOKEN: ${{ vars.GSC_TOKEN }}
          BING_TOKEN: ${{ vars.BING_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
